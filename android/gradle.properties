# Propriedades do Gradle: memoria reservada para a compilacao e uso do AndroidX
# (bibliotecas modernas de suporte do Android).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Opção adicionada pelo modelo do Flutter (formato de configuração do Gradle)
android.newDsl=false
# Opção adicionada pelo modelo do Flutter (Kotlin embutido no plugin Android)
android.builtInKotlin=false
