# =============================================================================
# pubspec.yaml
# -----------------------------------------------------------------------------
# Arquivo de CONFIGURAÇÃO do projeto Flutter. Define nome, versão, versão do
# Dart exigida e todas as BIBLIOTECAS (pacotes) usadas pelo app.
# Depois de alterar este arquivo, rode: flutter pub get
# =============================================================================

# Nome interno do pacote (usado nos imports: package:audiovisual_app/...).
name: audiovisual_app
description: "Banco de Talentos Geolocalizado para a Indústria Audiovisual (TCC)."

# Impede que o projeto seja publicado por engano no pub.dev (repositório
# público de pacotes Dart). Projeto privado.
publish_to: 'none'

# Versão do app no formato  MAIOR.MENOR.CORREÇÃO+BUILD
#   - 1.0.0 -> versionName no Android (o que o usuário vê);
#   - +1    -> versionCode no Android (número interno, sobe a cada envio).
version: 1.0.0+1

# Versão mínima do Dart exigida pelo projeto.
environment:
  sdk: ^3.12.2

# Dependências usadas pelo app em execução.
dependencies:
  # SDK do Flutter (obrigatório).
  flutter:
    sdk: flutter

  # Traduções oficiais dos componentes do Flutter (calendário, botões
  # "Cancelar/OK" etc.) para português do Brasil.
  flutter_localizations:
    sdk: flutter

  # --- Gerenciamento de Estado & Reatividade ---
  flutter_bloc: ^9.1.1            # Padrão BLoC: separa a lógica da tela (eventos -> estados)
  equatable: ^2.1.0               # Compara objetos pelo valor dos campos, sem sobrescrever operator==

  # --- Injeção de Dependência & Programação Funcional ---
  get_it: ^9.2.1                  # Service Locator: registro central de objetos (injeção de dependências)
  injectable: ^2.7.1+4            # Anotações (@injectable...) que geram o código de registro do GetIt
  fpdart: ^1.2.0                  # Programação funcional: Either<Failure, Sucesso> para tratar erros

  # --- Geolocalização & Mapas (Computação Espacial) ---
  geolocator: ^14.0.3             # Lê as coordenadas do GPS e pede a permissão de localização
  flutter_map: ^8.3.1             # Desenha mapas (OpenStreetMap ou outros provedores de tiles)
  latlong2: ^0.10.1               # Tipo LatLng e cálculos de distância entre coordenadas

  # --- Back-end ---
  supabase_flutter: ^2.9.0        # Banco PostgreSQL/PostGIS, login, arquivos e chat em tempo real

  # --- Arquivos e links ---
  image_picker: ^1.1.2            # Escolhe a foto de perfil na galeria do celular
  file_picker: ^13.1.0            # Escolhe o PDF do currículo nos arquivos do celular
  url_launcher: ^6.3.1            # Abre links externos (ex.: visualizar o currículo em PDF)

  # Ícones no estilo iOS (classe CupertinoIcons).
  cupertino_icons: ^1.0.9

# Dependências usadas APENAS durante o desenvolvimento (não vão no app final).
dev_dependencies:
  # Ferramentas de teste automatizado do Flutter.
  flutter_test:
    sdk: flutter

  # Regras de boas práticas verificadas pelo analisador (flutter analyze).
  # Ativadas no arquivo analysis_options.yaml.
  flutter_lints: ^6.0.0

  # --- Geração de Código (Code Generation) ---
  build_runner: ^2.15.1           # Executa os geradores de código do Dart
  injectable_generator: ^2.12.1   # Lê as anotações do injectable e gera injection.config.dart

# Configurações específicas do Flutter.
flutter:
  # Inclui a fonte de ícones do Material Design (classe Icons).
  uses-material-design: true

  # Para adicionar imagens ou fontes próprias no futuro, declare aqui. Ex.:
  # assets:
  #   - assets/images/logo.png
